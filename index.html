<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>為替トレード記録ツール</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <header class="container">
      <h1>為替トレード記録ツール</h1>
      <p>ChromeOS向けミニマム版</p>
    </header>

    <main class="container grid">
      <section class="card">
        <h2>取引を追加</h2>
        <form id="trade-form">
          <label>日時<input type="datetime-local" id="date" name="date" required /></label>
          <label>通貨ペア<input type="text" id="pair" name="pair" placeholder="USD/JPY" required /></label>
          <label>売買
            <select id="side" name="side" required>
              <option value="buy">Buy</option>
              <option value="sell">Sell</option>
            </select>
          </label>
          <label>ロット<input type="number" id="size" name="size" step="0.01" min="0" required /></label>
          <label>エントリー<input type="number" id="entry" name="entry" step="0.001" required /></label>
          <label>決済<input type="number" id="exit" name="exit" step="0.001" required /></label>
          <label>手数料<input type="number" id="fee" name="fee" step="0.01" value="0" /></label>
          <label>スワップ<input type="number" id="swap" name="swap" step="0.01" value="0" /></label>
          <label>メモ<textarea id="note" name="note" rows="2"></textarea></label>
          <button type="submit">追加</button>
        </form>
      </section>

      <section class="card">
        <h2>集計</h2>
        <ul id="summary">
          <li>件数: <strong id="sum-count">0</strong></li>
          <li>総損益: <strong id="sum-pnl">0</strong></li>
          <li>勝率: <strong id="sum-winrate">0%</strong></li>
        </ul>
      </section>

      <section class="card full">
        <h2>取引一覧</h2>
        <div class="actions">
          <button id="export-json" type="button">JSONエクスポート</button>
          <label class="import-label">
            JSONインポート
            <input id="import-json" type="file" accept="application/json" />
          </label>
        </div>
        <table>
          <thead>
            <tr>
              <th>日時</th>
              <th>通貨ペア</th>
              <th>売買</th>
              <th>損益</th>
              <th>メモ</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="trade-rows"></tbody>
        </table>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
